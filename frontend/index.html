    <script>
        const API = 'http://localhost:8000/api/v1';

        function parseMarkdown(text) {
            let html = '';
            const lines = text.split('\n');
            let inList = false;

            for (let line of lines) {
                line = line.trim();
                if (!line) {
                    if (inList) { html += '</ul>'; inList = false; }
                    continue;
                }
                if (line.startsWith('# ') && !line.startsWith('## ')) continue;
                else if (line.startsWith('## ')) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<h3>${parseInline(line.substring(3))}</h3>`;
                } else if (line.startsWith('### ')) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<h4>${parseInline(line.substring(4))}</h4>`;
                } else if (line.startsWith('- ') || line.startsWith('— ')) {
                    if (!inList) { html += '<ul>'; inList = true; }
                    const content = line.startsWith('— ') ? line.substring(2) : line.substring(2);
                    html += `<li>${parseInline(content)}</li>`;
                } else {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<p>${parseInline(line)}</p>`;
                }
            }
            if (inList) html += '</ul>';
            return html;
        }

        function parseInline(text) {
            text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            text = text.replace(/\*(.*?)\*/g, '<em>$1</em>');
            return text;
        }

        async function loadResume() {
            try {
                const res = await fetch(`${API}/main/resume`);
                const data = await res.json();
                const contentDiv = document.getElementById('resumeContent');

                if (data.error) {
                    contentDiv.innerHTML = `<p style="color: #ef4444;">${data.error}</p>`;
                } else if (data.content) {
                    contentDiv.innerHTML = parseMarkdown(data.content);
                } else {
                    contentDiv.innerHTML = '<p>Резюме не найдено</p>';
                }
            } catch (err) {
                document.getElementById('resumeContent').innerHTML = 'Ошибка загрузки резюме';
                console.error(err);
            }
        }

        loadResume();
    </script>
