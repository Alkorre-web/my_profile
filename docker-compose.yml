version: "3.8"

services:
  # Фронтенд через Nginx
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

  # Бэкенд FastAPI
  api:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app:ro
      - ./docs:/docs:ro
    depends_on:
      - postgres
      - mongo
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1

  # PostgreSQL (для аналитики событий)
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # MongoDB (для хранения MD-файлов... стоп, нет, MD-файлы в docs/)
  # MongoDB нужна только если будешь хранить логи/аналитику в ней
  # Если не используешь — можно тоже убрать
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    restart: unless-stopped

volumes:
  pgdata:
  mongodata: